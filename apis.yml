aid: remilk
name: Remilk
description: >-
  Remilk is a food-technology company, founded in 2019 by Aviv Wolff and Ori Cohavi and
  headquartered in Rehovot, Israel, that produces animal-free dairy proteins by precision
  fermentation. The company inserts the gene that codes for a cow milk protein into a yeast
  strain from the same family used in brewing and baking, ferments it at scale, and harvests a
  milk protein it describes as identical to the bovine original but free of lactose, cholesterol,
  hormones and antibiotics; the protein is then formulated with non-animal fat and sugar,
  vitamins and minerals into finished dairy products. Remilk has raised more than $150M, and was
  the first company to win regulatory clearance for a precision-fermented dairy protein in
  Israel, with subsequent clearances in Singapore, the United States (GRAS) and Canada. In
  November 2025 it commercialised the ingredient with Gad Dairies, Israel's fourth-largest dairy
  company, launching "The New Milk" barista and retail line, and it has publicly paused its plan
  to build what would have been the world's largest precision fermentation facility in Denmark.
  Remilk sells a food ingredient and consumer dairy products, not software: it operates no
  developer program, publishes no API, SDK, or machine-readable specification, and maintains no
  public source-code organization.
